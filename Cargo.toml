[package]
name = "taskmgr"
version = "0.1.0"
edition = "2024"

[dependencies]
crossterm = "0.29.0"
eframe = "0.32.3"
egui_extras = "0.32.3"
ratatui = "0.29.0"
sysinfo = "0.36.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"
# Use gdk-pixbuf to delegate icon theme resolution and SVG rasterization to system loaders
gdk-pixbuf = "0.15"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Environment",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
